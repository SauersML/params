name: gha-run

# CPU work for #2951 on a free runner of this public repository (4 CPUs, 16 GB RAM, 14 GB SSD, at
# most 6 h), dispatched by infra/runpod/gha-run:
#
#  - binaries: the named examples and test binaries built at a commit on ubuntu-22.04, the release
#    the GPU pods' image runs (runpod/pytorch:...-ubuntu22.04, same glibc). The CUDA code compiles at
#    run time through NVRTC, so the build needs no CUDA toolkit and no GPU. With a KEY (rp-run's hash
#    of the commit's Rust sources and gam's) they are published as assets KEY.NAME of the prerelease
#    rp-run-bin, which pods download without credentials.
#  - command: COMMAND run at the commit after the build, with MPD_BIN the directory of the built
#    binaries and OUT a directory uploaded as artifact NAME (7 days), which the Mac fetches with
#    `gha-run pull NAME`.
#  - chains: work longer than one job's 6 h runs as up to LINKS jobs in turn. Each link gives the
#    command LINK_MINUTES from the job's start (less the build) and exports DEADLINE (epoch seconds)
#    as that end. A command that exits 75 (unfinished; its state is saved under $OUT), or that the
#    link's time stops, has OUT uploaded and the next link dispatched, which downloads OUT before
#    running COMMAND again, so a command that resumes from its own state under $OUT continues.
#
# The Rust workspace depends on gam's crates by path (../gam/crates/...): this repository is checked
# out at params/ and github.com/SauersML/gam at gam/ beside it, at GAM_SHA (default: gam's main when
# the job starts; a chain's links all use the first link's), with only gam's root files and crates/.
# Commands run in params/.
#
# The repository is public, and so are this workflow's logs and artifacts: commands and inputs come
# only from public sources (the commit, public datasets, our own public exports), never keys,
# credentials or private data. Inputs reach the shell through the environment, never spliced into
# the script.

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Run name: the artifact's name and the run's title"
        required: true
      sha:
        description: "Commit to build and run at (40 hex)"
        required: true
      gam_sha:
        description: "Commit of SauersML/gam checked out beside it for the path dependencies (empty: gam's main)"
        default: ""
      key:
        description: "rp-run's source hash: publish the binaries as rp-run-bin assets KEY.NAME (empty: no release)"
        default: ""
      examples:
        description: "Examples to build, as PACKAGE:EXAMPLE words"
        default: ""
      tests:
        description: "Test binaries to build, as PACKAGE:TEST words (installed as test-TEST; TEST lib is the package's library unit tests)"
        default: ""
      command:
        description: "Shell command run at the commit after the build (empty: none)"
        default: ""
      links:
        description: "Most jobs a chain runs (1: no chaining)"
        default: "1"
      link:
        description: "This job's place in its chain"
        default: "1"
      link_minutes:
        description: "Minutes from a job's start until its command is stopped"
        default: "330"
      resume_run:
        description: "Run whose artifact NAME this job starts from (the previous link)"
        default: ""
      cache:
        description: "Build cache kind: empty for release builds (binaries); check, clippy or test for fastcheck's overflow"
        default: ""
      os:
        description: "Runner: ubuntu-22.04 (default) or macos-15 (Apple silicon: fastcheck's release builds for the Mac)"
        default: ""

run-name: gha-run ${{ inputs.name }}

permissions:
  contents: write
  # The next link of a chain is a dispatch of this workflow.
  actions: write

jobs:
  run:
    runs-on: ${{ inputs.os != '' && inputs.os || 'ubuntu-22.04' }}
    timeout-minutes: 355
    defaults:
      run:
        working-directory: params
    env:
      NAME: ${{ inputs.name }}
      SHA: ${{ inputs.sha }}
      KEY: ${{ inputs.key }}
      EXAMPLES: ${{ inputs.examples }}
      TESTS: ${{ inputs.tests }}
      COMMAND: ${{ inputs.command }}
      LINKS: ${{ inputs.links }}
      LINK: ${{ inputs.link }}
      LINK_MINUTES: ${{ inputs.link_minutes }}
    steps:
      - name: Start
        working-directory: .
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          path: params
          # The command gets no credentials: the token stays with the publish step.
          persist-credentials: false

      - name: gam's commit
        id: gam
        env:
          GAM_SHA: ${{ inputs.gam_sha }}
        run: |
          set -euo pipefail
          sha=${GAM_SHA:-$(git ls-remote https://github.com/SauersML/gam.git refs/heads/main | cut -f1)}
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "no gam commit ($sha)"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "gam at $sha"

      # gam's root files (Cargo.toml, Cargo.lock, rust-toolchain.toml) and crates/, blobs fetched only
      # for those paths.
      - uses: actions/checkout@v4
        with:
          repository: SauersML/gam
          ref: ${{ steps.gam.outputs.sha }}
          path: gam
          persist-credentials: false
          filter: blob:none
          sparse-checkout: crates

      # On macOS (fastcheck's release builds) sccache keeps every unchanged crate's objects across
      # commits, so a build recompiles only what the commit changed; the command sets RUSTC_WRAPPER.
      - uses: mozilla-actions/sccache-action@v0.0.9
        if: runner.os == 'macOS'

      - name: Toolchain (rust-toolchain.toml's)
        run: |
          f=rust-toolchain.toml
          [ -f "$f" ] || f=../gam/rust-toolchain.toml
          rustup toolchain install "$(sed -nE 's/^channel = "([^"]+)"/\1/p' "$f")" --profile minimal

      # One entry per lock file, toolchain and kind of build (release binaries; fastcheck's check,
      # clippy and test builds): the dependencies, which cost the build most, come from it; the
      # workspace's own crates and gam's rebuild from the commits. An entry per commit would evict
      # the other workflows' caches from the repository's 10 GB.
      # Saved (below) only when missing, and for check, clippy and test only by a run named
      # cache-KIND that builds the whole workspace's dependencies, so a narrow check never stores a
      # partial cache that every later check would then rebuild around.
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            params/target
          key: gha-run-${{ hashFiles('params/Cargo.lock', 'params/rust-toolchain.toml') }}${{ inputs.cache != '' && format('-{0}', inputs.cache) || '' }}${{ runner.os == 'macOS' && '-macos' || '' }}

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p bin
          for pkg in $(for w in $EXAMPLES; do echo "${w%%:*}"; done | sort -u); do
            flags=()
            for w in $EXAMPLES; do [ "${w%%:*}" = "$pkg" ] && flags+=(--example "${w#*:}"); done
            cargo build --release -p "$pkg" "${flags[@]}"
          done
          for w in $EXAMPLES; do cp "target/release/examples/${w#*:}" bin/; done
          for w in $TESTS; do
            pkg=${w%%:*} name=${w#*:}
            # TEST lib is the package's library unit tests (cargo's target name: the package's, - as _).
            if [ "$name" = lib ]; then sel=(--lib) target=${pkg//-/_}; else sel=(--test "$name") target=$name; fi
            exe=$(cargo test -p "$pkg" "${sel[@]}" --no-run --message-format=json |
              jq -r --arg n "$target" 'select(.reason == "compiler-artifact" and .executable != null and .target.name == $n) | .executable' | tail -n 1)
            [ -n "$exe" ] || { echo "no test executable for $w"; exit 1; }
            cp "$exe" "bin/test-$name"
          done
          ls -la bin

      - name: Publish binaries (assets KEY.NAME of the prerelease rp-run-bin)
        if: inputs.key != '' && (inputs.examples != '' || inputs.tests != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view rp-run-bin -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create rp-run-bin -R "$GITHUB_REPOSITORY" --prerelease --title "rp-run binaries" \
              --notes "Linux x86_64 binaries (ubuntu-22.04) of mpd and mpd-tensor examples and tests, one set per rp-run source hash, for #2951's rented GPU pods. Built by .github/workflows/gha-run.yml." || true
          mkdir -p publish
          for f in bin/*; do cp "$f" "publish/$KEY.$(basename "$f")"; done
          gh release upload rp-run-bin -R "$GITHUB_REPOSITORY" publish/* --clobber

      - name: Previous link's outputs
        if: inputs.command != '' && inputs.resume_run != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.name }}
          path: params/out
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}

      - name: Command
        id: command
        if: inputs.command != ''
        run: |
          mkdir -p out
          export MPD_BIN=$PWD/bin OUT=$PWD/out
          export DEADLINE=$(( JOB_START + LINK_MINUTES * 60 ))
          left=$(( DEADLINE - $(date +%s) ))
          (( left > 0 )) || { echo "no time left in this link (LINK_MINUTES $LINK_MINUTES)"; exit 1; }
          echo "# link $LINK of at most $LINKS; the command stops at $(date -u -r "$DEADLINE" 2> /dev/null || date -u -d "@$DEADLINE")" | tee -a out/command.log
          set +e
          # macOS has no GNU timeout; there the job's own limit stops the command.
          if command -v timeout > /dev/null; then
            timeout --signal=TERM --kill-after=60 "$left" bash -c "$COMMAND" 2>&1 | tee -a out/command.log
          else
            bash -c "$COMMAND" 2>&1 | tee -a out/command.log
          fi
          rc=${PIPESTATUS[0]}
          set -e
          # 75: unfinished, its state under $OUT; 124: the link's time ran out.
          if [ "$rc" = 75 ] || [ "$rc" = 124 ]; then
            echo "more=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$rc"

      # Data a command leaves under $OUT/rp-run-data (public-derived only: a FineWeb shard that
      # rp-run asked for), each file named by its sha256, goes up as an asset of the prerelease
      # rp-run-data, which pods then download instead of building it; it then leaves $OUT, so the
      # artifact does not carry it. A file named SHA.u16 or SHA.f32 is a float64 file in that
      # narrower form (rp-run publish's encoding): widened back to float64, its sha256 is SHA.
      - name: Publish data (assets SHA256 of the prerelease rp-run-data)
        if: inputs.command != '' && steps.command.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -d out/rp-run-data ] || exit 0
          gh release view rp-run-data -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create rp-run-data -R "$GITHUB_REPOSITORY" --prerelease --title "rp-run data" \
              --notes "Public inputs of #2951's GPU runs (VPD's public weights, exports derived from them, public datasets), one asset per file named by its sha256, for pods to download." || true
          have=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/tags/rp-run-data" --jq '.assets[].name')
          if ls out/rp-run-data | grep -qE '[.](u16|f32)$'; then python3 -m pip install -q numpy; fi
          for f in out/rp-run-data/*; do
            name=$(basename "$f")
            case $name in
              *.u16|*.f32)
                sum=$(python3 -c 'import hashlib, sys
          import numpy as np
          x = np.memmap(sys.argv[1], dtype="<u2" if sys.argv[1].endswith(".u16") else "<f4", mode="r")
          h = hashlib.sha256()
          for i in range(0, len(x), 1 << 24):
              h.update(np.asarray(x[i:i + (1 << 24)]).astype("<f8").tobytes())
          print(h.hexdigest())' "$f") ;;
              *) sum=$(sha256sum "$f" | cut -c1-64) ;;
            esac
            want=${name%.u16} want=${want%.f32}
            [ "$sum" = "$want" ] || { echo "$name is not its file's sha256 ($sum)"; exit 1; }
            grep -qx "$name" <<< "$have" || gh release upload rp-run-data -R "$GITHUB_REPOSITORY" "$f"
          done
          rm -rf out/rp-run-data

      - uses: actions/cache/save@v4
        if: always() && steps.cache.outputs.cache-hit != 'true' && (inputs.cache == '' || startsWith(inputs.name, 'cache-'))
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            params/target
          key: gha-run-${{ hashFiles('params/Cargo.lock', 'params/rust-toolchain.toml') }}${{ inputs.cache != '' && format('-{0}', inputs.cache) || '' }}${{ runner.os == 'macOS' && '-macos' || '' }}

      - uses: actions/upload-artifact@v4
        if: always() && inputs.command != ''
        with:
          name: ${{ inputs.name }}
          path: params/out/
          retention-days: 7
          if-no-files-found: ignore

      - name: Next link
        if: steps.command.outputs.more == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GAM_SHA: ${{ steps.gam.outputs.sha }}
        run: |
          (( LINK < LINKS )) || { echo "the command is unfinished after $LINKS links"; exit 1; }
          gh workflow run gha-run.yml -R "$GITHUB_REPOSITORY" --ref main -f name="$NAME" -f sha="$SHA" -f gam_sha="$GAM_SHA" -f key="" \
            -f examples="$EXAMPLES" -f tests="$TESTS" -f command="$COMMAND" -f links="$LINKS" \
            -f link="$(( LINK + 1 ))" -f link_minutes="$LINK_MINUTES" -f resume_run="$GITHUB_RUN_ID"
          echo "dispatched link $(( LINK + 1 ))"
