name: gha-run

# CPU work for #2951 on a free runner of this public repository (4 CPUs, 16 GB RAM, 14 GB SSD, at
# most 6 h), dispatched by experiments/infra/runpod/gha-run:
#
#  - command: COMMAND run at the commit, with OUT a directory uploaded as artifact NAME (7 days),
#    which the Mac fetches with `gha-run pull NAME`.
#  - chains: work longer than one job's 6 h runs as up to LINKS jobs in turn. Each link gives the
#    command LINK_MINUTES from the job's start and exports DEADLINE (epoch seconds)
#    as that end. A command that exits 75 (unfinished; its state is saved under $OUT), or that the
#    link's time stops, has OUT uploaded and the next link dispatched, which downloads OUT before
#    running COMMAND again, so a command that resumes from its own state under $OUT continues.
#
# The repository is public, and so are this workflow's logs and artifacts: commands and inputs come
# only from public sources (the commit, public datasets, our own public exports), never keys,
# credentials or private data. Inputs reach the shell through the environment, never spliced into
# the script.

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Run name: the artifact's name and the run's title"
        required: true
      sha:
        description: "Commit to build and run at (40 hex)"
        required: true
      command:
        description: "Shell command run at the commit (empty: none)"
        default: ""
      links:
        description: "Most jobs a chain runs (1: no chaining)"
        default: "1"
      link:
        description: "This job's place in its chain"
        default: "1"
      link_minutes:
        description: "Minutes from a job's start until its command is stopped"
        default: "330"
      resume_run:
        description: "Run whose artifact NAME this job starts from (the previous link)"
        default: ""

run-name: gha-run ${{ inputs.name }}

permissions:
  contents: write
  # The next link of a chain is a dispatch of this workflow.
  actions: write

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    env:
      NAME: ${{ inputs.name }}
      SHA: ${{ inputs.sha }}
      COMMAND: ${{ inputs.command }}
      LINKS: ${{ inputs.links }}
      LINK: ${{ inputs.link }}
      LINK_MINUTES: ${{ inputs.link_minutes }}
    steps:
      - name: Start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          # The command gets no credentials: the token stays with the publish step.
          persist-credentials: false

      - name: Previous link's outputs
        if: inputs.command != '' && inputs.resume_run != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.name }}
          path: out
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}

      - name: Command
        id: command
        if: inputs.command != ''
        run: |
          mkdir -p out
          export OUT=$PWD/out
          export DEADLINE=$(( JOB_START + LINK_MINUTES * 60 ))
          left=$(( DEADLINE - $(date +%s) ))
          (( left > 0 )) || { echo "no time left in this link (LINK_MINUTES $LINK_MINUTES)"; exit 1; }
          echo "# link $LINK of at most $LINKS; the command stops at $(date -u -r "$DEADLINE" 2> /dev/null || date -u -d "@$DEADLINE")" | tee -a out/command.log
          set +e
          # macOS has no GNU timeout; there the job's own limit stops the command.
          if command -v timeout > /dev/null; then
            timeout --signal=TERM --kill-after=60 "$left" bash -c "$COMMAND" 2>&1 | tee -a out/command.log
          else
            bash -c "$COMMAND" 2>&1 | tee -a out/command.log
          fi
          rc=${PIPESTATUS[0]}
          set -e
          # 75: unfinished, its state under $OUT; 124: the link's time ran out.
          if [ "$rc" = 75 ] || [ "$rc" = 124 ]; then
            echo "more=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$rc"

      - uses: actions/upload-artifact@v4
        if: always() && inputs.command != ''
        with:
          name: ${{ inputs.name }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore

      - name: Next link
        if: steps.command.outputs.more == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (( LINK < LINKS )) || { echo "the command is unfinished after $LINKS links"; exit 1; }
          gh workflow run gha-run.yml -R "$GITHUB_REPOSITORY" --ref main -f name="$NAME" -f sha="$SHA" \
            -f command="$COMMAND" -f links="$LINKS" \
            -f link="$(( LINK + 1 ))" -f link_minutes="$LINK_MINUTES" -f resume_run="$GITHUB_RUN_ID"
          echo "dispatched link $(( LINK + 1 ))"
