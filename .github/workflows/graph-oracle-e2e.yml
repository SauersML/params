name: Graph Oracle E2E

# The graph oracle's tests (#2951) on a CPU runner: mech (the loader of graph answers), edits, reader,
# part tokens, copycheck, prompted, score, the goal scorecard on a tiny random model of vpd4l's
# architecture (its vpd4l checks skip here), the frozen reader of the RL loop, and the RL scorer and
# trainer (scripts) on a tiny random Qwen3. test_mech's sandbox test tokenizes with vpd4l's
# tokenizer, a file under the Mac's mpd-data, and is left out here. No test runs the Rust checker
# (method/crates/mpd/examples/mpd_graph_2951.rs), so nothing here compiles.

on:
  push:
    branches: [main]
    paths:
      - "method/oracle/**"
      - "method/vpd/vpd_model.py"
      - "experiments/oracle/**"
      - ".github/workflows/graph-oracle-e2e.yml"
  workflow_dispatch:
    inputs:
      replay_saved_toy_wiring:
        description: "Replay four fixed public toy truth/active completions with executed wiring (no policy generation)"
        type: boolean
        required: false
        default: false


      include_saved_toy_policy:
        description: "Also replay the frozen three-case intersection with public SFT completions (no generation)"
        type: boolean
        required: false
        default: false

concurrency:
  group: graph-oracle-e2e-${{ github.event_name == 'workflow_dispatch' && inputs.replay_saved_toy_wiring && github.run_id || github.ref }}
  cancel-in-progress: false  # pushes come every few minutes: finish the running check, keep only the newest pending one

permissions:
  contents: read

jobs:
  e2e:
    name: graph oracle tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU torch and the test dependencies
        run: |
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q 'pytest>=8' numpy scipy safetensors transformers peft tokenizers huggingface_hub httpx

      - name: Check executed toy wiring
        run: python -m pytest experiments/oracle/toyloop/test_wiring.py -q --tb=short

      - name: Check weight-use, intervention, English and data controls
        run: |
          python -m pytest method/oracle/rl/test_inject.py method/oracle/test_intervention_panel.py \
            method/oracle/test_reward_gate.py method/oracle/test_reward_compactness.py \
            method/oracle/test_semantic.py method/oracle/test_task_data.py \
            method/oracle/test_tools_env.py::test_baselines_include_empty_and_same_batch_calibration \
            method/oracle/test_components.py::test_fit_pool_reports_nonfit_and_later_fitting_row \
            method/oracle/test_components.py::test_question_node_cap_is_opt_in_and_included_in_fit \
            method/oracle/test_units.py::test_evidence_binds_selected_replacement_without_new_measurements \
            method/oracle/test_units.py::test_evidence_without_token_change_does_not_decode_or_add_a_donor \
            method/oracle/test_components.py::test_invariants_roundtrip_separate_prose_and_bind_numbered_variables \
            method/oracle/test_components.py::test_invariant_diagnostic_executes_decoded_groups_separately \
            method/oracle/test_components.py::test_invariants_renumber_noncontiguous_refs_after_variable_reordering \
            method/oracle/test_components.py::test_checked_invariants_reject_wrong_execution_or_group_and_holdout \
            method/oracle/test_components.py::test_dataset_preserves_checked_invariants_and_failed_provenance_opt_in \
            method/oracle/test_components.py::test_rerender_skips_nonfit_pool_row_and_counts_variables_before_fit -q --tb=short

      - name: Run the graph oracle's tests
        env:
          MEM_LEASE_GIB: "1"
          MPD_MEM_GIB: "1"
        run: |
          python -m pytest method/oracle/test_mech.py method/oracle/test_edits.py method/oracle/test_reader.py \
            method/oracle/test_part_tokens.py experiments/oracle/test_copycheck.py experiments/oracle/test_prompted.py \
            method/oracle/test_score.py method/oracle/test_goal_eval.py method/oracle/rl/test_reader_frozen.py \
            --deselect method/oracle/test_mech.py::test_the_sandbox_limits_and_the_server \
            -p no:cacheprovider -v --tb=short
          python -B method/oracle/rl/test_scorer.py
          python -B method/oracle/rl/test_train.py

      - name: Replay saved toy teacher wiring
        if: always() && github.event_name == 'workflow_dispatch' && inputs.replay_saved_toy_wiring
        timeout-minutes: 8
        run: |
          git fetch --no-tags --depth=1 origin 9e3782861caa3e738d6b91122a527487157df349
          git fetch --no-tags --depth=1 origin b2fd915944c0589dabc9295805f37bbabe30439f
          git worktree add --detach "${{ runner.temp }}/toy-replay-scorer" b2fd915944c0589dabc9295805f37bbabe30439f
          cp experiments/oracle/toyloop/replay_wiring.py "${{ runner.temp }}/toy-replay-scorer/experiments/oracle/toyloop/replay_wiring.py"
          policy_args=()
          if [ '${{ inputs.include_saved_toy_policy }}' = 'true' ]; then
            git fetch --no-tags --depth=1 origin 830010f2f4f534d628c51610fa1632774d0e02f6
            policy_args=(--policy-file experiments/oracle/toyloop/results/eval_sft_noleak.json --policy-source 830010f2f4f534d628c51610fa1632774d0e02f6)
          fi
          TOY_REPLAY_DRIVER_COMMIT="${{ github.sha }}" python -u "${{ runner.temp }}/toy-replay-scorer/experiments/oracle/toyloop/replay_wiring.py" \
            --out "${{ runner.temp }}/toy-wiring-replay" "${policy_args[@]}"

      - name: Upload saved toy wiring replay
        if: always() && github.event_name == 'workflow_dispatch' && inputs.replay_saved_toy_wiring
        uses: actions/upload-artifact@v4
        with:
          name: saved-toy-wiring-replay-${{ github.sha }}
          path: ${{ runner.temp }}/toy-wiring-replay
          if-no-files-found: warn
