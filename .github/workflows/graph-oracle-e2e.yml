name: Graph Oracle E2E

# The graph oracle's tests (#2951) on a CPU runner: mech (the loader of graph answers), edits, reader,
# part tokens, copycheck, prompted, score, the frozen reader of the RL loop, and the RL scorer and
# trainer (scripts) on a tiny random Qwen3. test_mech's sandbox test tokenizes with vpd4l's
# tokenizer, a file under the Mac's mpd-data, and is left out here. No test runs the Rust checker
# (crates/mpd/examples/mpd_graph_2951.rs), so nothing here compiles.

on:
  push:
    branches: [main]
    paths:
      - "oracle/graph/**"
      - ".github/workflows/graph-oracle-e2e.yml"
  workflow_dispatch:

concurrency:
  group: graph-oracle-e2e-${{ github.ref }}
  cancel-in-progress: false  # pushes come every few minutes: finish the running check, keep only the newest pending one

permissions:
  contents: read

jobs:
  e2e:
    name: graph oracle tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU torch and the test dependencies
        run: |
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q 'pytest>=8' numpy safetensors transformers peft tokenizers huggingface_hub

      - name: Run the graph oracle's tests
        env:
          MEM_LEASE_GIB: "1"
          MPD_MEM_GIB: "1"
        run: |
          python -m pytest oracle/graph/test_mech.py oracle/graph/test_edits.py oracle/graph/test_reader.py \
            oracle/graph/test_part_tokens.py oracle/graph/test_copycheck.py oracle/graph/test_prompted.py \
            oracle/graph/test_score.py oracle/graph/rl/test_reader_frozen.py \
            --deselect oracle/graph/test_mech.py::test_the_sandbox_limits_and_the_server \
            -p no:cacheprovider -v --tb=short
          python -B oracle/graph/rl/test_scorer.py
          python -B oracle/graph/rl/test_train.py
