name: plan-render

# The source is the team's live coordination map. Generated files do not retrigger this job.
on:
  push:
    branches: [main]
    paths:
      - plan/plan.mmd
      - plan/mermaid.json
      - .github/workflows/plan-render.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plan-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install renderer and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter fonts-dejavu-core > /dev/null
          npm install --prefix "$RUNNER_TEMP/plan-render" @mermaid-js/mermaid-cli@11.4.2
          echo '{"args": ["--no-sandbox", "--disable-setuid-sandbox"]}' > "$RUNNER_TEMP/puppeteer.json"
      - name: Render latest plan and publish image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch --no-tags origin main
            # Only this disposable CI checkout is reset. Never rebase a stale rendered image.
            git reset --hard origin/main
            "$RUNNER_TEMP/plan-render/node_modules/.bin/mmdc" \
              -p "$RUNNER_TEMP/puppeteer.json" -i plan/plan.mmd \
              -o plan/plan.png -c plan/mermaid.json -b white -s 1
            printf '%s\n' '![Oracle team coordination map](plan/plan.png)' > README.md
            git add plan/plan.png README.md
            if git diff --cached --quiet; then
              echo "Latest plan already rendered"
              exit 0
            fi
            git commit -m "plan: render current coordination map"
            if git push origin HEAD:main; then exit 0; fi
            # Another writer won: fetch its changes and rerender, preserving its source.
            sleep $((attempt * 5))
          done
          echo "Main kept changing; no stale rendering was pushed" >&2
          exit 1
