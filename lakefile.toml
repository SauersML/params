name = "Params"
version = "0.1.0"
defaultTargets = ["Params"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.0"

[[lean_lib]]
name = "Params"
moreLeanArgs = ["-DwarningAsError=true"]

[lean_lib.leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
